name: SDK check
on:
  push:
    paths: [".github/workflows/sdk-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  inspect:
    runs-on: xcode-27
    steps:
      - name: Versions
        run: |
          xcodebuild -version
          echo "iOS SDK : $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: API ciblées (P2 « Je parle, c'est classé »)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          iface() { find "$SDK/System/Library/Frameworks/$1.framework" -name '*.swiftinterface' -path '*arm64e-apple-ios*' | head -1; }
          FM="$(iface FoundationModels)"; SP="$(iface Speech)"
          clean() { sed -E 's/(FoundationModels|Speech|Swift|Foundation|_Concurrency|AVFAudio|CoreMedia)::/ /g' | cut -c1-220; }
          echo "::group::FoundationModels — respond / Generable / Guide"
          grep -nE "func respond\(to|macro Generable|macro Guide|func maximumCount|func count\(|struct Response|var content" "$FM" | grep -v "Executor" | clean | head -40
          echo "::endgroup::"
          echo "::group::FoundationModels — GenerationError"
          awk '/enum GenerationError/{f=1} f{print NR": "$0} /^  }$/{if(f)exit}' "$FM" | grep -E "case |enum GenerationError" | clean | head -30
          echo "::endgroup::"
          echo "::group::FoundationModels — UnavailableReason"
          awk '/enum UnavailableReason/{f=1} f{print NR": "$0} /^    }$/{if(f)exit}' "$FM" | grep -E "case |enum Unavailable" | clean | head -15
          echo "::endgroup::"
          echo "::group::Speech — SpeechTranscriber options, Result, presets"
          grep -nE "enum Preset|static (var|let) (transcription|progressiveTranscription|timeIndexedTranscriptionWithAlternatives|offlineTranscription|timeIndexed)|case (volatileResults|fastResults|alternativeTranscriptions|audioTimeRange|etiquetteReplacements|transcriptionConfidence)|struct Result|var text|var isFinal|var results|func supportedLocale|bestAvailableAudioFormat|finalizeAndFinish|func finish|func start\(|func analyzeSequence|downloadAndInstall|class AssetInstallationRequest|struct AnalyzerInput|init\(buffer" "$SP" | clean | head -80
          echo "::endgroup::"
